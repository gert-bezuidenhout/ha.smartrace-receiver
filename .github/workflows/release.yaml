name: Release
on:
  push:
    branches: [main]
    paths:
      - custom_components/smartrace_receiver/manifest.json
      - .github/workflows/release.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Home Assistant validation
        uses: home-assistant/actions/hassfest@master
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '.version' custom_components/smartrace_receiver/manifest.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$VERSION.md"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "SmartRace Receiver $VERSION" --notes-file "docs/releases/$VERSION.md" --latest
